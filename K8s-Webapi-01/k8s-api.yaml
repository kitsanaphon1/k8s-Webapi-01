apiVersion: v1
kind: Service
metadata:
  name: webapi
spec:
  selector:
    app: webapi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapi
  template:
    metadata:
      labels:
        app: webapi
    spec:
      containers:
        - name: webapi
          image: sooyaa02/webappandapi:v1.7
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Database=mydb;Username=myuser;Password=mypassword"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /api/products
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      restartPolicy: Always